<!doctype html>
<html th:replace="~{layout/base :: layout(~{::section})}" xmlns:th="http://www.thymeleaf.org">
  <body>
    <section th:fragment="section">
      <div class="govuk-grid-row">
        <div class="govuk-grid-column-two-thirds">
          <h1 class="govuk-heading-xl" th:text="${heading}">Your application</h1>
          <p class="govuk-body">Complete every section before you check your answers.</p>
          <th:block th:each="section : ${sectionsHtml}" th:utext="${section}"></th:block>
        </div>
      </div>
    </section>
  </body>
</html>
