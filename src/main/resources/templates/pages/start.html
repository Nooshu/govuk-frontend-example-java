<!doctype html>
<html th:replace="~{layout/base :: layout(~{::section})}" xmlns:th="http://www.thymeleaf.org">
  <body>
    <section th:fragment="section">
      <div class="govuk-grid-row">
        <div class="govuk-grid-column-two-thirds">
          <th:block th:utext="${notificationHtml}"></th:block>
          <h1 class="govuk-heading-xl" th:text="${heading}">Apply for a fishing rod licence</h1>
          <p class="govuk-body-l" th:text="${lede}"></p>
          <th:block th:utext="${startButtonHtml}"></th:block>
          <p class="govuk-body" th:text="${timing}"></p>
          <th:block th:utext="${warningHtml}"></th:block>
          <th:block th:utext="${insetHtml}"></th:block>
          <th:block th:utext="${detailsHtml}"></th:block>
          <th:block th:if="${demosEnabled}">
            <h2
              class="govuk-heading-m"
              th:text="${htmlLang == 'cy'} ? 'Rhagolygon datblygwyr' : 'Developer previews'"
            ></h2>
            <p class="govuk-body">
              <a
                class="govuk-link"
                href="/components"
                th:text="${htmlLang == 'cy'} ? 'Rhagolwg o gydrannau GOV.UK' : 'Preview GOV.UK components'"
              ></a>
              <th:block th:if="${htmlLang != 'cy'}">
                — a separate page for each component, rendered by this service’s Java
                library.</th:block
              >
            </p>
          </th:block>
        </div>
      </div>
    </section>
  </body>
</html>
