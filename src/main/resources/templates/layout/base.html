<!doctype html>
<html
  th:fragment="layout (content)"
  th:lang="${htmlLang}"
  class="govuk-template"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <meta charset="utf-8" />
    <title th:text="${pageTitle}">GOV.UK</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d70b8" />
    <link rel="stylesheet" th:href="${stylesheetHref}" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" sizes="48x48" href="/assets/images/favicon.ico" />
    <link rel="icon" sizes="any" href="/assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="mask-icon" href="/assets/images/govuk-icon-mask.svg" color="#1d70b8" />
    <link rel="apple-touch-icon" href="/assets/images/govuk-icon-180.png" />
    <link rel="manifest" href="/assets/manifest.json" />
  </head>
  <body class="govuk-template__body">
    <script th:utext="${jsEnabledSnippet}"></script>
    <th:block th:utext="${skipLinkHtml}"></th:block>
    <form th:if="${cookieBannerHtml != null}" method="post" action="/cookie-choices" novalidate>
      <input type="hidden" name="csrf" th:value="${csrf}" />
      <input type="hidden" name="returnPath" th:value="${returnPath}" />
      <th:block th:utext="${cookieBannerHtml}"></th:block>
    </form>
    <header class="govuk-template__header">
      <th:block th:utext="${headerHtml}"></th:block>
      <th:block th:utext="${serviceNavigationHtml}"></th:block>
    </header>
    <div class="govuk-width-container">
      <th:block th:utext="${phaseBannerHtml}"></th:block>
      <th:block th:if="${backLinkHtml != null}" th:utext="${backLinkHtml}"></th:block>
      <th:block
        th:if="${backLinkHtml == null and breadcrumbsHtml != null}"
        th:utext="${breadcrumbsHtml}"
      ></th:block>
      <main
        th:class="'govuk-main-wrapper' + (${mainClasses != null and !#strings.isEmpty(mainClasses)} ? ' ' + ${mainClasses} : '')"
        id="main-content"
      >
        <th:block th:utext="${demoBannerHtml}"></th:block>
        <th:block th:replace="${content}"></th:block>
      </main>
    </div>
    <footer class="govuk-template__footer">
      <th:block th:if="${showFeedback}" th:utext="${feedbackHtml}"></th:block>
      <th:block th:utext="${footerHtml}"></th:block>
    </footer>
    <script type="module" th:src="${appModuleHref}"></script>
  </body>
</html>
